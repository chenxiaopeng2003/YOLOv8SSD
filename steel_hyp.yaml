# YOLOv8 钢材微调专用配置 (适配 RTX 3050 4G)
# 核心策略：利用数据增强弥补分辨率的不足

# --- 优化器与学习率 ---
lr0: 0.005          # 微调初始学习率 (比从头训练小，防止破坏权重)
lrf: 0.01           # 最终学习率
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# --- 损失函数 ---
box: 8.0            # 稍微增加边框定位权重 (默认7.5)，提高定位精度
cls: 0.5
dfl: 1.5

# --- 数据增强 (针对 4GB 显存优化的关键点) ---
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0        # 保持为0，因为钢材纹理方向通常固定，旋转会破坏特征
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0

# --- 关键修改区域 ---
flipud: 0.5         # 【开启】钢板上下翻转在流水线上很常见，必须开启！
fliplr: 0.5         # 左右翻转保持开启
mosaic: 1.0         # 保持开启，但在最后10轮会自动关闭
mixup: 0.1          # 【开启】轻微开启，帮助模型区分重叠特征
copy_paste: 0.1     # 【开启】对小目标(夹杂物)有效，且不增加显存负担