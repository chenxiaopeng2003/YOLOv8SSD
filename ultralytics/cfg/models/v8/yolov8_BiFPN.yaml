# yolov8_CBAM_Ghost_BiFPN_3Heads.yaml
nc: 10 # 对应 GC10-DET 的 10 类缺陷
scales:
  n: [0.33, 0.25, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, GhostConv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, GhostConv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2

  - [-1, 1, GhostConv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4
  - [-1, 1, CBAM, []] # 5-P3_Attention (提取为关键特征层)

  - [-1, 1, GhostConv, [512, 3, 2]] # 6-P4/16
  - [-1, 6, C2f, [512, True]] # 7
  - [-1, 1, CBAM, []] # 8-P4_Attention (提取为关键特征层)

  - [-1, 1, GhostConv, [1024, 3, 2]] # 9-P5/32
  - [-1, 3, C2f, [1024, True]] # 10
  - [-1, 1, SPPF, [1024, 5]] # 11-P5_out (提取为关键特征层)

neck:
  # --- 自上而下路径 (Top-down) ---
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12 (P5 -> P4大小)
  - [[-1, 8], 1, Concat, [1]] # 13 融合: P5上采样 + 原始P4(层8)
  - [-1, 3, C2f, [512]] # 14 (P4_中间层)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15 (P4 -> P3大小)
  - [[-1, 5], 1, Concat, [1]] # 16 融合: P4上采样 + 原始P3(层5)
  - [-1, 3, C2f, [256]] # 17 (P3_输出层 -> 倒数第7层)

  # --- 自下而上路径 (Bottom-up, 引入 BiFPN 跨层融合思想) ---
  - [-1, 1, GhostConv, [256, 3, 2]] # 18 (P3 -> P4大小)
  - [[-1, 14, 8], 1, Concat, [1]] # 19 核心融合: 当前(18) + 中间(14) + 原始P4(8)
  - [-1, 3, C2f, [512]] # 20 (P4_输出层 -> 倒数第4层)

  - [-1, 1, GhostConv, [512, 3, 2]] # 21 (P4 -> P5大小)
  - [[-1, 11], 1, Concat, [1]] # 22 核心融合: 当前(21) + 原始P5(11)
  - [-1, 3, C2f, [1024]] # 23 (P5_输出层 -> 倒数第1层)

head:
  # 使用相对负数索引，指向 Neck 中生成的三个特征图，绝对不会越界
  - [[-7, -4, -1], 1, Detect, [nc]]
