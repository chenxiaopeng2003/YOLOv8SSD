nc: 10 # 对应 GC10-DET 的 10 类缺陷
scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, GhostConv, [64, 3, 2]] # 0
  - [-1, 1, GhostConv, [128, 3, 2]] # 1
  - [-1, 3, C2f, [128, True]] # 2
  - [-1, 1, CBAM, []] # 3-P2

  - [-1, 1, GhostConv, [256, 3, 2]] # 4
  - [-1, 6, C2f, [256, True]] # 5
  - [-1, 1, CBAM, []] # 6-P3

  - [-1, 1, GhostConv, [512, 3, 2]] # 7
  - [-1, 6, C2f, [512, True]] # 8
  - [-1, 1, CBAM, []] # 9-P4

  - [-1, 1, GhostConv, [1024, 3, 2]] # 10
  - [-1, 3, C2f, [1024, True]] # 11
  - [-1, 1, SPPF, [1024, 5]] # 12-P5

neck:
  # --- 自上而下 ---
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 3], 1, Concat, [1]]
  - [-1, 3, C2f, [128]] # (倒数第 10 层：P2 检测头前置层)

  # --- 自下而上 (BiFPN 加强) ---
  - [-1, 1, GhostConv, [128, 3, 2]]
  - [[-1, 18, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [256]] # (倒数第 7 层：P3 检测头前置层)

  - [-1, 1, GhostConv, [256, 3, 2]]
  - [[-1, 15, 9], 1, Concat, [1]]
  - [-1, 3, C2f, [512]] # (倒数第 4 层：P4 检测头前置层)

  - [-1, 1, GhostConv, [512, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]] # (倒数第 1 层：P5 检测头前置层)

head:
  # 使用相对负数索引，避免一切绝对层数计算导致的 IndexError
  - [[-10, -7, -4, -1], 1, Detect, [nc]]
